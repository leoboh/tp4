services:
  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
      POSTGRES_DB: tp3
    ports:
      - "5432:5432"
    volumes:
      # Persistance des données (volume nommé géré par Docker)
      - db-data:/var/lib/postgresql/data
      # Scripts SQL exécutés au premier démarrage
      - ./db-init:/docker-entrypoint-initdb.d:ro
  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: leo
      DB_PASSWORD: leo
      DB_NAME: tp3
    ports:
      - "3000:3000"
    init: true
 
volumes:
  db-data: